<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B3D31">
<title>統香生產看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23C99A2E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen factory tool. Sticky top bar with tabs; touch-sized cards; bottom sheet for completion. */
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --sunk:#E8EAE2; --line:#D9DDD2; --ink:#18221D; --muted:#5E6A63;
  --green:#1B3D31; --green-ink:#FFFFFF; --gold:#C99A2E; --gold-soft:#F5EAD0; --gold-ink:#7A5A12;
  --red:#B3402A; --red-soft:#F8E1DB; --amber:#9A6A0B; --amber-soft:#FBEFD3; --ok:#2E7354; --ok-soft:#DDEFE5;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#17211D; --sunk:#1F2B26; --line:#2C3A34; --ink:#E7ECE9; --muted:#9AA8A0;
  --green:#2F6B55; --green-ink:#FFFFFF; --gold:#D8AE4A; --gold-soft:#3A3018; --gold-ink:#F0D48C;
  --red:#E07A63; --red-soft:#3D1F18; --amber:#E2B24F; --amber-soft:#3A2D12; --ok:#6BC59A; --ok-soft:#183328; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211D; --sunk:#1F2B26; --line:#2C3A34; --ink:#E7ECE9; --muted:#9AA8A0;
  --green:#2F6B55; --green-ink:#FFFFFF; --gold:#D8AE4A; --gold-soft:#3A3018; --gold-ink:#F0D48C;
  --red:#E07A63; --red-soft:#3D1F18; --amber:#E2B24F; --amber-soft:#3A2D12; --ok:#6BC59A; --ok-soft:#183328; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;touch-action:manipulation}
.btnlink{display:inline-flex;align-items:center;min-height:48px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}
.dim{opacity:.5}
button:disabled{opacity:.6;cursor:wait}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:48px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;width:100%}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:var(--green-ink);padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-size:18px;letter-spacing:.04em}
.brand small{font-size:11px;letter-spacing:.18em;opacity:.75}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:transparent;border:0;color:var(--green-ink);opacity:.72;font-size:16px;min-height:44px;padding:8px 14px;border-radius:8px}
.tabs button[aria-selected="true"]{opacity:1;background:rgba(255,255,255,.14);box-shadow:inset 0 -3px 0 var(--gold)}
.clock{margin-left:auto;font-size:20px;letter-spacing:.04em}
main{padding-block:16px 48px;padding-inline:16px;max-width:1100px;margin:0 auto}
.status{font-size:13px;color:var(--muted);margin:0 0 12px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;display:flex;align-items:baseline;gap:8px}
.stat b{font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.stat.red b{color:var(--red)}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card.over{border-color:var(--red)}
.grip{font-size:28px;color:var(--muted);cursor:grab;padding:8px 4px;touch-action:none;user-select:none;line-height:1}
.seq{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:600;font-size:18px}
.pname{font-size:19px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--muted);margin-top:2px}
.pill{font-size:13px;padding:2px 9px;border-radius:999px;font-weight:500}
.p-today{background:var(--red-soft);color:var(--red)}
.p-tom{background:var(--amber-soft);color:var(--amber)}
.p-later{background:var(--sunk);color:var(--muted)}
.p-over{background:var(--red);color:#fff}
.p-code{background:var(--gold-soft);color:var(--gold-ink)}
.done-btn{background:var(--green);color:var(--green-ink);border:0;font-size:17px;font-weight:500;min-height:56px;padding:10px 22px}
.ghost-sort{opacity:.35}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
h2{font-size:20px;margin:24px 0 10px;text-wrap:balance}
h2:first-child{margin-top:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.primary{background:var(--green);color:var(--green-ink);border:0;font-weight:500}
.danger{color:var(--red)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td button{min-height:38px;padding:6px 12px;font-size:14px}
.err{color:var(--red);font-size:14px;min-height:20px}
.hint{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:52px;padding:8px 16px;font-size:16px}
.chip[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>.lbl{font-size:13px;color:var(--muted);letter-spacing:.06em}
.lot{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.seg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:6px 10px;border-radius:10px;background:var(--sunk);color:var(--muted)}
.seg.man{background:var(--surface);border:2px solid var(--gold);color:var(--ink)}
.seg.active{background:var(--gold-soft)}
.seg b{font-family:var(--f-mono);font-size:30px;line-height:1.1;color:var(--ink)}
.seg small{font-size:11px}
.dash{font-family:var(--f-mono);font-size:30px;align-self:center;color:var(--muted)}
.kp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kp button{min-height:60px;font-size:24px;font-family:var(--f-mono)}
.big-lot{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:.06em;color:var(--green)}
:root[data-theme="dark"] .big-lot{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .big-lot{color:var(--gold)}}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:30;font-size:15px;max-width:calc(100% - 32px)}
@media (max-width:640px){
  .card{grid-template-columns:auto minmax(0,1fr);}
  .card .seq{display:none}
  .card .done-btn{grid-column:1 / -1;width:100%}
  .clock{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>統香生產看板</b><small>TS BEEHONEY</small></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="board" aria-selected="true">生產看板</button>
    <button role="tab" data-tab="orders" aria-selected="false">訂單輸入</button>
    <button role="tab" data-tab="records" aria-selected="false">生產紀錄</button>
    <button role="tab" data-tab="settings" aria-selected="false">設定</button>
  </nav>
  <div class="clock mono" id="clock"></div>
</header>
<main id="main">
  <p class="status" id="status">連線中…</p>
  <section id="v-board"></section>
  <section id="v-orders" hidden></section>
  <section id="v-records" hidden></section>
  <section id="v-settings" hidden></section>
</main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<script src="/vendor/Sortable.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
